<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 재설정</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --main-red: #e63946;
      --text-color: #222;
      --muted-color: #777;
      --border-color: #eee;
    }

    body {
      background-color: #f9f9f9;
      font-family: 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      max-width: 420px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
    }

    h2 {
      color: var(--main-red);
      margin-bottom: 24px;
      font-size: 24px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--main-red);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--muted-color);
    }

    .error {
      color: var(--main-red);
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }

    .success {
      color: green;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <form class="container" onsubmit="return submitResetPassword(event)">
    <h2>비밀번호 재설정</h2>
    <div id="error" class="error" style="display: none;"></div>
    <div id="success" class="success" style="display: none;"></div>

    <label for="password">새 비밀번호</label>
    <input type="password" id="password" required>

    <label for="confirm-password">비밀번호 확인</label>
    <input type="password" id="confirm-password" required>

    <button type="submit">비밀번호 변경하기</button>
    <div class="footer">© 2025 Campus Meet</div>
  </form>

  <script>
    async function submitResetPassword(event) {
      event.preventDefault();
      const token = new URLSearchParams(window.location.search).get("token");
      const pw = document.getElementById("password").value;
      const confirmPw = document.getElementById("confirm-password").value;
      const error = document.getElementById("error");
      const success = document.getElementById("success");

      error.style.display = "none";
      success.style.display = "none";

      if (!token) {
        error.textContent = "토큰이 유효하지 않습니다.";
        error.style.display = "block";
        return;
      }

      if (pw !== confirmPw) {
        error.textContent = "비밀번호가 일치하지 않습니다.";
        error.style.display = "block";
        return;
      }

      try {
        const res = await fetch("/api/v1/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, password: pw })
        });

        if (res.status === 200) {
          success.textContent = "비밀번호가 성공적으로 변경되었습니다.";
          success.style.display = "block";
        } else {
          const text = await res.text();
          error.textContent = "에러: " + text;
          error.style.display = "block";
        }
      } catch (e) {
        error.textContent = "요청 중 문제가 발생했습니다.";
        error.style.display = "block";
      }
    }
  </script>
</body>
</html>
