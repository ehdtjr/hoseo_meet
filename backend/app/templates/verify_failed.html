<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이메일 인증 실패</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --main-red: #e63946;
      --text-color: #222;
      --muted-color: #777;
      --border-color: #eee;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f9f9f9;
      font-family: 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      color: var(--text-color);
    }

    .card {
      background-color: #fff;
      padding: 48px 36px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      max-width: 460px;
      width: 100%;
      text-align: center;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      color: var(--main-red);
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    .message {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 12px;
      color: var(--main-red);
    }

    .subtext {
      font-size: 15px;
      color: var(--muted-color);
      line-height: 1.6;
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Campus Meet</div>
    <div class="message">이메일 인증에 실패했습니다</div>
    <div class="subtext">
      링크가 유효하지 않거나<br>이미 사용된 인증 링크일 수 있어요.<br><br>
      다시 시도해주시거나 인증 메일을 재전송해주세요.
    </div>
    <div class="footer">© 2025 Campus Meet</div>
  </div>
</body>
</html>
