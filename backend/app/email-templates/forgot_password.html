<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 재설정</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --main-red: #e63946;
      --text-color: #222;
      --muted-color: #777;
      --border-color: #eee;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f9f9f9;
      font-family: 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      color: var(--text-color);
    }

    .card {
      background-color: #fff;
      padding: 48px 36px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      max-width: 460px;
      width: 100%;
      text-align: center;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      color: var(--main-red);
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    .message {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .subtext {
      font-size: 15px;
      color: var(--muted-color);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .button {
      display: inline-block;
      padding: 12px 24px;
      background-color: var(--main-red);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Campus Meet</div>
    <div class="message">비밀번호 재설정 요청</div>
    <div class="subtext">
      {{ user.name }} 님, <br>
      비밀번호 재설정을 위해 아래 버튼을 눌러주세요.<br>
      이 링크는 보안을 위해 일정 시간 후 만료됩니다.
    </div>
    <a href="{{ reset_link }}" class="button">비밀번호 재설정하기</a>
    <div class="footer">© 2025 Campus Meet</div>
  </div>
</body>
</html>
