# Local development and CI. Production manifests are separate.
x-backend: &backend
  image: hoseo-local-backend
  build:
    context: ./backend
    dockerfile: Dockerfile.local
  env_file: .env
  volumes:
    - app-media:/data/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Generate root .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate root .env first}
      POSTGRES_DB: ${POSTGRES_DB:?Generate root .env first}
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  init:
    <<: *backend
    command: [python, -m, app.scripts.local_init]
  web:
    <<: *backend
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/info/health")']
      interval: 5s
      timeout: 3s
      retries: 30
  celery-worker:
    <<: *backend
    command: [celery, -A, app.celery.worker, worker, --loglevel=info, --concurrency=1]
    depends_on:
      init:
        condition: service_completed_successfully
  celery-beat:
    <<: *backend
    command: [celery, -A, app.celery.worker, beat, --loglevel=info, --schedule=/data/beat/celerybeat-schedule]
    volumes:
      - beat-data:/data/beat
    depends_on:
      init:
        condition: service_completed_successfully
  admin:
    build: ./frontend/web/admin-dashboard
    ports:
      - '127.0.0.1:${ADMIN_PORT:-5173}:80'
    depends_on:
      web:
        condition: service_healthy
        restart: true
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${MAIL_PORT:-8025}:8025'
  test-db:
    image: postgis/postgis:16-3.5
    profiles: [test]
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, test_user, -d, test_db]
      interval: 3s
      timeout: 3s
      retries: 30
  test-redis:
    image: redis:7-alpine
    profiles: [test]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  test:
    <<: *backend
    profiles: [test]
    volumes: []
    environment:
      POSTGRES_SERVER: test-db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
      REDIS_HOST: test-redis
      TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@test-db:5432/test_db
      TEST_REDIS_URL: redis://test-redis:6379
      LOCAL_MEDIA_ROOT: /tmp/test-media
      FCM_ENABLED: 'false'
      AI_ENABLED: 'false'
      STORAGE_BACKEND: local
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    command: [python, -m, pytest, app/tests, -q, -W, 'error::RuntimeWarning']
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes:
      - ./prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '127.0.0.1:9090:9090'
  grafana:
    image: grafana/grafana:12.2.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-${FIRST_SUPERUSER_PASSWORD}}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-storage:/var/lib/grafana
    ports:
      - '127.0.0.1:3000:3000'
volumes:
  app-db-data:
  app-media:
  redis-data:
  beat-data:
  grafana-storage:
